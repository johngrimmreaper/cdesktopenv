name: CDE package CI - Debian 12

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cde-package-debian-12-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build cde-desktop on Debian 12
    runs-on: ubuntu-24.04
    container:
      image: debian:12
    timeout-minutes: 180

    env:
      DEBIAN_FRONTEND: noninteractive
      IFFEFLAGS: -d1

    steps:
      - name: Bootstrap Debian 12 container
        shell: bash
        run: |
          set -Eeuo pipefail

          apt-get update

          apt-get install -y \
            --no-install-recommends \
            ca-certificates \
            git

      - name: Check out exact CDE source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Trust mounted GitHub workspace
        shell: bash
        run: |
          set -Eeuo pipefail

          test -n "${GITHUB_WORKSPACE:-}"

          echo "=== execution identity ==="
          id

          echo
          echo "=== workspace ownership ==="
          stat -c '%u:%g %U:%G %n' "$GITHUB_WORKSPACE"

          git config \
            --global \
            --add safe.directory \
            "$GITHUB_WORKSPACE"

          echo
          echo "=== trusted Git workspace ==="
          git rev-parse HEAD

      - name: Show build environment
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=== operating system ==="
          cat /etc/os-release

          echo
          echo "=== architecture ==="
          dpkg --print-architecture

          echo
          echo "=== kernel ==="
          uname -a

          echo
          echo "=== CPUs ==="
          nproc

          echo
          echo "=== disk ==="
          df -h "$GITHUB_WORKSPACE"

          echo
          echo "=== CDE commit ==="
          git rev-parse HEAD

      - name: Install Debian package build tooling
        shell: bash
        run: |
          set -Eeuo pipefail

          apt-get \
            -o Acquire::Retries=3 \
            update

          apt-get \
            -o Acquire::Retries=3 \
            install -y \
            --no-install-recommends \
            build-essential \
            devscripts \
            equivs \
            fakeroot

      - name: Install CDE build dependencies
        shell: bash
        working-directory: cde
        run: |
          set -Eeuo pipefail

          mk-build-deps \
            --install \
            --remove \
            --tool 'apt-get -y -o Acquire::Retries=3 --no-install-recommends' \
            debian/control

          dpkg-checkbuilddeps

      - name: Build cde-desktop binary package
        shell: bash
        working-directory: cde
        run: |
          set -Eeuo pipefail

          dpkg-buildpackage \
            -b \
            -us \
            -uc

      - name: Collect package artifacts
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p out

          find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*.deb' \
              -o -name '*.ddeb' \
              -o -name '*.changes' \
              -o -name '*.buildinfo' \
            \) \
            -exec cp -v '{}' out/ ';'

          shopt -s nullglob
          debs=(out/*.deb)

          if (( ${#debs[@]} == 0 )); then
              echo "ERROR: build produced no .deb package" >&2
              exit 1
          fi

          echo
          echo "=== generated artifacts ==="
          find out \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "=== package metadata ==="

          for package in "${debs[@]}"; do
              echo
              echo "--- $package ---"
              dpkg-deb --info "$package"
          done

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cde-desktop-debian-12-${{ github.event.pull_request.head.sha || github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 30

  test-install:
    name: Install-test cde-desktop on clean Debian 12
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: debian:12
    timeout-minutes: 30

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Bootstrap Debian 12 container
        shell: bash
        run: |
          set -Eeuo pipefail

          apt-get update

          apt-get install -y \
            --no-install-recommends \
            ca-certificates

      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cde-desktop-debian-12-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifact

      - name: Inspect downloaded package
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=== downloaded files ==="
          find artifact \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          shopt -s nullglob
          debs=(artifact/cde-desktop_*_amd64.deb)

          if (( ${#debs[@]} != 1 )); then
              echo "ERROR: expected exactly one cde-desktop amd64 .deb" >&2
              printf 'found: %s\n' "${debs[@]:-none}" >&2
              exit 1
          fi

          echo
          echo "=== package metadata ==="
          dpkg-deb --info "${debs[0]}"

      - name: Install package on clean Debian 12 container
        shell: bash
        run: |
          set -Eeuo pipefail

          shopt -s nullglob
          debs=(artifact/cde-desktop_*_amd64.deb)

          apt-get \
            -o Acquire::Retries=3 \
            update

          apt-get \
            -o Acquire::Retries=3 \
            install -y \
            --no-install-recommends \
            "./${debs[0]}"

          echo
          echo "=== installed package ==="
          dpkg-query \
            -W \
            -f='${binary:Package}\t${Version}\t${Architecture}\t${db:Status-Status}\n' \
            cde-desktop

          echo
          echo "=== dependency consistency ==="
          apt-get check

          echo
          echo "=== dpkg audit ==="
          dpkg --audit

          echo
          echo "=== installed-file verification ==="
          dpkg -V cde-desktop
